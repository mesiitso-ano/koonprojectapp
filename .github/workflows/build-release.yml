name: Build et Release Automatique

on:
  push:
    tags:
      - 'v*' # Déclenche sur les tags v1.0.0, v1.0.1, etc.
  workflow_dispatch: # Permet de lancer manuellement

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installation Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Installation dépendances NPM
        run: npm install

      - name: Build Tauri
        run: npm run tauri build

      - name: Upload .exe
        uses: actions/upload-artifact@v3
        with:
          name: koon-windows
          path: src-tauri/target/release/koon.exe

      - name: Upload .msi
        uses: actions/upload-artifact@v3
        with:
          name: koon-installer
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Créer Release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            src-tauri/target/release/koon.exe
            src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
