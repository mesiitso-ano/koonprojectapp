<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- Empêche le zoom tactile involontaire -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Titre de la fenêtre native Windows -->
    <title>Koon</title>
    <!-- Désactive le drag natif des images (comportement non désiré dans une app desktop) -->
    <style>
      * { -webkit-user-drag: none; }
      img { pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Point de montage React : toute l'UI est injectée ici par main.tsx -->
    <div id="root"></div>
    <!-- Entry point du bundle React généré par Vite -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
